apiVersion: v1
kind: Pod
metadata:
  name: minifi-agent-k8s
  namespace: cld-streaming
spec:
  containers:
  - name: minifi
    image: ubuntu:22.04
    imagePullPolicy: IfNotPresent
    command: ["/bin/bash", "-c"]
    args:
    - |
      set -e
      apt-get update && apt-get install -y curl tar python3 python3-pip python3-venv
      ln -s /usr/bin/python3 /usr/bin/python || true

      # Wait for EFM to be up before invoking the deployer — EFM's cold start
      # is ~2 minutes, so on a fresh minikube boot the deployer curl races
      # ahead of Jetty and fails with `Connection refused`. Poll actuator/health
      # until 200, up to ~10 min, then run the deployer.
      echo "Waiting for EFM to be reachable..."
      for i in $(seq 1 120); do
        code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 \
          http://efm.cld-streaming.svc:10090/efm/actuator/health || true)
        if [ "$code" = "200" ]; then
          echo "EFM is up (HTTP $code) after ${i} attempts."
          break
        fi
        echo "  attempt ${i}: EFM not ready (HTTP $code) — retrying in 5s"
        sleep 5
      done

      curl -L \
       -d agentClass=KubernetesPod \
       -d agentIdentifier=e99e45f5-70f5-4847-af76-4f620b764aa9 \
       -d agentType=cpp \
       -d agentVersion=1.26.02 \
       -d autoConfigureSecurity=false \
       -d baseUrl=http%3A%2F%2Fefm.cld-streaming.svc%3A10090%2Fefm%2Fapi \
       -d hbPeriod=5000 \
       -d osArch=linux \
       -d serviceName=minifi \
       -d serviceUser=root \
       -d trustSelfSignedCertificates=false \
       http://efm.cld-streaming.svc:10090/efm/api/agent-deployer/script | bash -
      tail -f /dev/null